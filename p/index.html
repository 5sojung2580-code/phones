<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Virtual Phone</title><style>

/* 채팅 화면: 제목과 입력창은 고정, 대화만 스크롤 */
.screen:has(.chat){
  height:calc(100% - 45px);
  overflow:hidden;
  padding:14px 22px 12px;
  box-sizing:border-box;
}
.screen:has(.chat) .appscreen{
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  height:100%;
  min-height:0;
  overflow:hidden;
}
.screen:has(.chat) .heading{grid-row:1;}

  grid-row:2;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior:contain;
  padding-bottom:15px;
}
.screen:has(.chat) .compose{
  grid-row:3;
  position:relative;
  bottom:auto;
  margin:0;
  flex-shrink:0;
  z-index:10;

let data=structuredClone(DEFAULT);window.applyRemoteData=(value)=>{data={...structuredClone(DEFAULT),...value,apps:{...DEFAULT.apps,...(value.apps||{})}};state='lock';trackIndex=0;syncTrack();render()};let state='lock',chatIndex=0,photoIndex=0,entered='',calling=false;const screen=document.getElementById('screen');const icons={messages:'☏',gallery:'▧',phone:'☎',settings:'⚙'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{};function bg(){const p=document.getElementById('phone');const th={mono:['#f1f2f4','#303840'],blue:['#b9edf0','#245f6b'],pink:['#f7dfe7','#7d435b'],dark:['#222936','#f7f8fc']}[data.design?.theme]||['#f1f2f4','#303840'];p.style.color=th[1];if(data.design){p.style.background=data.design.backgroundImage?`url("${data.design.backgroundImage}") center/cover`:(data.design.background||th[0]);return}p.style.background=data.wallpaper?`linear-gradient(#ffffff22,#ffffff22),url("${data.wallpaper}") center/cover`: 'linear-gradient(135deg,#fff 0%,#f3f3f3 65%,#fff 65%,#e9eaed 100%)'}function time(){let d=new Date();document.getElementById('statusTime').textContent=d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});return d}function render(){bg();let d=time();if(state==='lock'){screen.innerHTML=`<div class="clock">${d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false})}</div><div class="date">${d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}).toUpperCase()}</div><div class="music"><strong>♫ Music Player</strong><small id="musicTitle">${esc(tracks()[trackIndex]?.title||data.music)}</small><input aria-label="재생 위치" type="range" min="0" max="1000" value="0" id="musicSeek" style="width:100%;accent-color:#fff;margin:12px 0"><div class="controls"><button type="button" data-music="prev">◀◀</button><button type="button" id="musicRepeat" data-music="repeat">↻</button><button type="button" id="musicPlay" data-music="tog
