<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Virtual Phone</title><style>
:root{font-family:Arial,'Apple SD Gothic Neo',sans-serif;color:#303438}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#e7e8eb}.phone{width:min(390px,100vw);height:min(820px,100dvh);border:15px solid #40444b;border-radius:48px;box-shadow:0 25px 70px #0002;position:relative;overflow:hidden;background:linear-gradient(135deg,#fff 0%,#f3f3f3 65%,#fff 65%,#e9eaed 100%)}.status{height:37px;display:flex;justify-content:space-between;padding:15px 19px 0;font-size:11px;position:relative;z-index:5}.speaker{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:74px;height:6px;background:#222;border-radius:6px}.screen{height:calc(100% - 45px);position:relative;overflow:auto;padding:14px 22px 80px}.bottom{position:absolute;bottom:11px;left:50%;transform:translateX(-50%);width:115px;height:5px;border-radius:9px;background:#3d4248;z-index:6;cursor:pointer}.hidden{display:none!important}button{cursor:pointer;font:inherit;border:0}.clock{font-size:65px;font-weight:200;text-align:center;margin-top:80px}.date{text-align:center;letter-spacing:3px;font-size:12px}.music{margin:30px 5px;padding:20px;border-radius:24px;background:linear-gradient(115deg,#42484b,#191c1d);color:#fff}.music strong{font-size:20px}.music small{display:block;margin:5px 0 15px}.progress{height:4px;background:#777;border-radius:5px}.progress:before{content:'';display:block;width:65%;height:100%;background:#fff}.controls{display:flex;justify-content:space-around;margin-top:18px;align-items:center}.unlock{position:absolute;bottom:55px;left:25px;right:25px;background:#e2e3e5;border-radius:50px;height:55px;display:flex;align-items:center;cursor:pointer}.unlock:before{content:'➜';display:grid;place-items:center;width:76px;height:55px;border-radius:50px;background:#42474e;color:white;font-size:22px}.unlock span{font-size:10px;letter-spacing:2px;flex:1;text-align:center}.pattern-title{text-align:center;margin:40px 0 12px;font-size:20px}.pattern-sub{text-align:center;font-size:12px;color:#777}.pattern-grid{width:260px;height:260px;margin:50px auto 20px;position:relative;touch-action:none;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);place-items:center}.dot{width:23px;height:23px;background:#d7d9dc;border:3px solid #555c64;border-radius:50%;position:relative;z-index:2}.dot.active{background:#41464d;box-shadow:0 0 0 8px #41464d22}.pattern-grid svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}.error{text-align:center;color:#a84c4c;height:20px;font-size:13px}.back{background:transparent;font-size:16px;padding:7px 0}.home{padding:8px 14px 75px}.widget{background:linear-gradient(120deg,#414648,#181b1c);color:white;border-radius:25px;padding:23px;margin:28px 6px 30px;height:222px}.widget .month{font-size:13px;font-weight:bold;margin-bottom:18px}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:10px 5px;text-align:center;font-size:12px}.appgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:21px 9px}.app{display:flex;flex-direction:column;align-items:center;gap:7px;background:transparent;padding:0;min-width:0}.appicon{width:58px;height:58px;display:grid;place-items:center;border-radius:17px;background:#f1f1f1;box-shadow:6px 7px 13px #00000012,-5px -5px 12px #fff;color:#33383b;font-size:29px}.app label{font-size:10px;white-space:nowrap}.dock{position:absolute;bottom:28px;left:18px;right:18px;display:flex;justify-content:space-around}.dock button{background:#292e31;color:white;border-radius:50%;width:53px;height:53px;font-size:24px}.appscreen{background:#fafafa;min-height:100%;padding:12px 17px}.heading{display:flex;align-items:center;gap:12px;margin-bottom:20px}.heading h2{font-size:24px;margin:0}.listitem{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:white;padding:15px;border-bottom:1px solid #eee}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#d7d9dd;font-size:19px}.muted{color:#858585;font-size:12px}.bubble{background:#e9e9ec;border-radius:17px;padding:12px;max-width:85%;align-self:flex-start;white-space:pre-wrap}.bubble.me{background:#454a50;color:white;align-self:flex-end}.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:20px}.compose{display:flex;gap:6px;position:sticky;bottom:0;background:#fafafa;padding:12px 0}.compose input{flex:1;min-width:0;border:1px solid #ddd;border-radius:30px;padding:12px}.compose button,.primary{background:#41464c;color:white;padding:11px 17px;border-radius:25px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.photos button{padding:0;background:#e8e8e8;aspect-ratio:1;overflow:hidden}.photos img{width:100%;height:100%;object-fit:cover}.photo-full{width:100%;max-height:65vh;object-fit:contain}.dial{text-align:center;font-size:28px;letter-spacing:3px;height:55px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;max-width:270px;margin:20px auto}.keypad button{height:66px;border-radius:50%;background:#e9e9eb;font-size:26px}.callbtn{display:block;margin:15px auto;background:#4b9c69;color:white;border-radius:50%;width:66px;height:66px;font-size:28px}.endcall{background:#bb5454}.setting{padding:16px;background:#fff;border-radius:13px;margin-bottom:12px}.wallpaper{background-size:cover!important;background-position:center!important}@media(max-width:420px){body{background:#fff}.phone{border-width:0;border-radius:0;width:100vw;height:100dvh;box-shadow:none}.speaker{top:6px}}

.custom-home{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:66px;gap:8px;padding-top:30px}.custom-tile{border:0;border-radius:16px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:5px;overflow:hidden}.custom-tile span{font-size:25px}.custom-tile small{font-size:10px;overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}.custom-tile img{width:34px;height:34px;object-fit:cover;border-radius:9px}.custom-tile.is-widget{align-items:flex-start;padding:15px}.custom-tile.is-widget span{font-size:34px}.custom-tile.is-widget small{font-size:13px}.custom-dock{position:absolute;bottom:28px;left:15px;right:15px;display:flex;justify-content:space-around;background:#ffffff55;backdrop-filter:blur(10px);border-radius:23px;padding:10px}.custom-dock button{width:45px;height:45px;border-radius:14px;background:#ffffffb5;color:#32404a;font-size:23px}
</style></head><body><div class="phone" id="phone"><div class="speaker"></div><div class="status"><span id="statusTime">10:10</span><span>●●● ◉ ▰</span></div><main class="screen" id="screen"></main><div class="bottom" id="homebar" title="홈 화면"></div></div><script>
const DEFAULT={name:'가상 휴대폰',pattern:'12369',wallpaper:'',wallColor:'#f5f5f5',music:'The Song',messages:[{name:'차주한',texts:[{from:'them',text:'안녕. 이 휴대폰을 발견했구나.'},{from:'me',text:'여기는 어디야?'}]},{name:'알 수 없는 번호',texts:[{from:'them',text:'확인해야 할 것이 있어.'}]}],photos:[],contacts:[{name:'차주한',number:'010-1234-5678'}],apps:{messages:'메시지',gallery:'갤러리',phone:'전화',settings:'설정'},design:null};
let data=structuredClone(DEFAULT);window.applyRemoteData=(value)=>{data={...structuredClone(DEFAULT),...value,apps:{...DEFAULT.apps,...(value.apps||{})}};state='lock';render()};let state='lock',chatIndex=0,photoIndex=0,entered='',calling=false;const screen=document.getElementById('screen');const icons={messages:'☏',gallery:'▧',phone:'☎',settings:'⚙'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{};function bg(){const p=document.getElementById('phone');const th={mono:['#f1f2f4','#303840'],blue:['#b9edf0','#245f6b'],pink:['#f7dfe7','#7d435b'],dark:['#222936','#f7f8fc']}[data.design?.theme]||['#f1f2f4','#303840'];p.style.color=th[1];if(data.design){p.style.background=data.design.backgroundImage?`url("${data.design.backgroundImage}") center/cover`:(data.design.background||th[0]);return}p.style.background=data.wallpaper?`linear-gradient(#ffffff22,#ffffff22),url("${data.wallpaper}") center/cover`: 'linear-gradient(135deg,#fff 0%,#f3f3f3 65%,#fff 65%,#e9eaed 100%)'}function time(){let d=new Date();document.getElementById('statusTime').textContent=d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});return d}function render(){bg();let d=time();if(state==='lock'){screen.innerHTML=`<div class="clock">${d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false})}</div><div class="date">${d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}).toUpperCase()}</div><div class="music"><strong>Album Cover</strong><small>${esc(data.music)}</small><div class="progress"></div><div class="controls"><span>◀◀</span><span>↻</span><span>▶</span><span>♥</span><span>▶▶</span></div></div><div class="unlock" id="unlock"><span>SLIDE TO UNLOCK</span></div>`;document.getElementById('unlock').onclick=()=>go('pattern');return}if(state==='pattern'){screen.innerHTML=`<button class="back" id="back">‹ 뒤로</button><h2 class="pattern-title">패턴 잠금 해제</h2><div class="pattern-sub">점을 연결하여 잠금을 해제하세요</div><div class="pattern-grid" id="pattern"><svg viewBox="0 0 260 260" id="lines"></svg>${Array.from({length:9},(_,i)=>`<div class="dot" data-n="${i+1}"></div>`).join('')}</div><div class="error" id="error"></div>`;document.getElementById('back').onclick=()=>go('lock');initPattern();return}if(state==='home'){let days=Array.from({length:35},(_,i)=>i<6?'':String(i-5));screen.className='screen home';screen.innerHTML=data.design?.tiles?.length?renderCustomHome(d):`<div class="widget"><div class="month">${d.toLocaleDateString('en-US',{month:'long',year:'numeric'}).toUpperCase()}</div><div class="cal">${['S','M','T','W','T','F','S',...days].map(x=>`<span>${x}</span>`).join('')}</div></div><div class="appgrid">${Object.keys(icons).map(k=>`<button class="app" data-app="${k}"><span class="appicon">${icons[k]}</span><label>${esc(data.apps?.[k]||k)}</label></button>`).join('')}<button class="app" data-app="contacts"><span class="appicon">♟</span><label>연락처</label></button><button class="app" data-app="lock"><span class="appicon">♧</span><label>잠금</label></button></div><div class="dock"><button data-app="contacts">♟</button><button data-app="messages">☏</button><button data-app="gallery">▧</button><button data-app="phone">☎</button></div>`;screen.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>go(b.dataset.app));return}screen.className='screen';let title={messages:data.apps.messages,gallery:data.apps.gallery,phone:data.apps.phone,settings:data.apps.settings,contacts:'연락처',chat:data.messages[chatIndex]?.name,photo:'사진',calling:'통화 중'}[state]||state;let head=`<div class="heading"><button class="back" id="back">‹</button><h2>${esc(title)}</h2></div>`;let content='';if(state==='messages')content=data.messages.map((m,i)=>`<button class="listitem" data-chat="${i}"><span class="avatar">☻</span><span><strong>${esc(m.name)}</strong><br><span class="muted">${esc(m.texts.at(-1)?.text||'')}</span></span></button>`).join('');if(state==='chat')content=`<div class="chat">${data.messages[chatIndex].texts.map(m=>`<div class="bubble ${m.from==='me'?'me':''}">${esc(m.text)}</div>`).join('')}</div><form class="compose" id="send"><input id="msg" placeholder="메시지 입력" required><button>전송</button></form>`;if(state==='gallery')content=`<div class="photos">${data.photos.length?data.photos.map((p,i)=>`<button data-photo="${i}"><img src="${p.url}" alt="${esc(p.caption)}"></button>`).join(''):'<p class="muted">편집기에서 사진을 추가할 수 있어요.</p>'}</div>`;if(state==='photo')content=`<img class="photo-full" src="${data.photos[photoIndex].url}"><p>${esc(data.photos[photoIndex].caption)}</p>`;if(state==='phone')content=`<div class="dial" id="dial"></div><div class="keypad">${'123456789*0#'.split('').map(x=>`<button data-digit="${x}">${x}</button>`).join('')}</div><button class="callbtn" id="call">☎</button><p class="muted" style="text-align:center">가상 통화만 지원합니다</p>`;if(state==='calling')content=`<div style="text-align:center;margin-top:130px"><h1>${esc(entered)}</h1><p>가상 통화 중…</p><button class="callbtn endcall" id="endcall">☎</button></div>`;if(state==='contacts')content=data.contacts.map(c=>`<button class="listitem" data-number="${esc(c.number)}"><span class="avatar">♟</span><span><strong>${esc(c.name)}</strong><br><span class="muted">${esc(c.number)}</span></span></button>`).join('');if(state==='settings')content=`<div class="setting">휴대폰 이름: ${esc(data.name)}</div><div class="setting">패턴 잠금: 활성화됨</div><div class="setting">콘텐츠 변경은 편집자 페이지에서 가능합니다.</div><button class="primary" id="relock">화면 잠그기</button>`;screen.innerHTML=`<div class="appscreen">${head}${content}</div>`;document.getElementById('back').onclick=()=>go(state==='chat'?'messages':state==='photo'?'gallery':'home');screen.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>{chatIndex=+b.dataset.chat;go('chat')});screen.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>{photoIndex=+b.dataset.photo;go('photo')});screen.querySelectorAll('[data-number]').forEach(b=>b.onclick=()=>{entered=b.dataset.number;go('phone');document.getElementById('dial').textContent=entered});screen.querySelectorAll('[data-digit]').forEach(b=>b.onclick=()=>{entered+=b.dataset.digit;document.getElementById('dial').textContent=entered});if(document.getElementById('call'))document.getElementById('call').onclick=()=>{if(entered)go('calling')};if(document.getElementById('endcall'))document.getElementById('endcall').onclick=()=>{entered='';go('phone')};if(document.getElementById('relock'))document.getElementById('relock').onclick=()=>go('lock');if(document.getElementById('send'))document.getElementById('send').onsubmit=e=>{e.preventDefault();let v=document.getElementById('msg').value.trim();if(v){data.messages[chatIndex].texts.push({from:'me',text:v});save();render();screen.scrollTop=screen.scrollHeight}}}

function renderCustomHome(d){const themes={mono:['#fff','#303840','#dce0e3'],blue:['#e9fbfb','#245f6b','#78cbd2'],pink:['#fff6f9','#7d435b','#efb8cd'],dark:['#394352','#f7f8fc','#334e63']};let [tile,ink,widget]=themes[data.design.theme]||themes.mono;return `<div class="custom-home">${data.design.tiles.map(t=>`<button class="custom-tile ${t.type==='widget'?'is-widget':''}" style="grid-column:span ${t.size===4?4:t.size===2?2:1};grid-row:span ${t.type==='widget'?2:1};background:${t.type==='widget'?widget:tile};color:${ink}" ${t.type==='app'?`data-app="${esc(t.app||'messages')}"`:''}>${t.image?`<img src="${esc(t.image)}" alt="">`:`<span>${esc(t.symbol||'◉')}</span>`}<small>${esc(t.label||'')}</small></button>`).join('')}</div><div class="custom-dock"><button data-app="phone">☎</button><button data-app="messages">✉</button><button data-app="gallery">▧</button><button data-app="settings">⚙</button></div>`}
function go(s){state=s;screen.className='screen';render()}document.getElementById('homebar').onclick=()=>go(state==='lock'?'pattern':'home');function initPattern(){const grid=document.getElementById('pattern'),dots=[...grid.querySelectorAll('.dot')],svg=document.getElementById('lines');let active=false,seq=[],points=[];function center(el){let a=el.getBoundingClientRect(),b=grid.getBoundingClientRect();return {x:a.left+a.width/2-b.left,y:a.top+a.height/2-b.top}}function draw(){svg.innerHTML=points.length?`<polyline points="${points.map(p=>`${p.x},${p.y}`).join(' ')}" fill="none" stroke="#44494f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`:''}function add(e){let el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.dot');if(el&&grid.contains(el)){let n=el.dataset.n;if(!seq.includes(n)){seq.push(n);points.push(center(el));el.classList.add('active');draw()}}}grid.addEventListener('pointerdown',e=>{active=true;seq=[];points=[];dots.forEach(x=>x.classList.remove('active'));grid.setPointerCapture(e.pointerId);add(e)});grid.addEventListener('pointermove',e=>{if(active)add(e)});grid.addEventListener('pointerup',()=>{if(!active)return;active=false;if(seq.join('')===String(data.pattern)){go('home')}else{document.getElementById('error').textContent='패턴이 일치하지 않습니다';setTimeout(()=>{if(state==='pattern'){dots.forEach(x=>x.classList.remove('active'));svg.innerHTML=''}},500)}})}
if(window.PHONE_DATA){data=window.PHONE_DATA}render();setInterval(()=>{time();if(state==='lock')render()},30000);
</script><div id="remoteNotice" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:999;background:#303438;color:white;padding:9px 16px;border-radius:12px;font:13px Arial;display:none"></div><script type="module" src="./firebase-player.js"></script></body></html>
